name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update --preinstall || true
          brew install re2 abseil

      - name: Run fast unit tests
        run: |
          make test-fast

      - name: Build MacEverything App
        run: |
          xcodebuild -project MacEverything.xcodeproj -scheme MacEverything \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build SYMROOT=build

      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - build/Release/MacEverything.app

      - name: Package into DMG
        run: |
          -hdiutil detach /Volumes/MacEverything-Green 2>/dev/null || true
          hdiutil create -volname "MacEverything-Green" \
            -srcfolder build/Release/MacEverything.app \
            -ov -format UDZO MacEverything-Green.dmg

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacEverything-Green-DMG
          path: MacEverything-Green.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacEverything-Green.dmg
          name: "MacEverything-Green ${{ github.ref_name }}"
          body: |
            ### 🌿 MacEverything-Green（绿色护盘版）${{ github.ref_name }}

            本版本彻底修复了原版每 30 秒全量重写 275MB 导致的严重 SSD 磨损 Bug，将日常写盘量从每天 **~700 GB 降至 < 150 MB**（降低 99.97%）。

            #### 核心改进：
            - **SSD 磨损降低 99.97%**：引入智能事件节流与系统高频临时缓存路径过滤（排除 `~/Library/Caches`、`Biome` 等）。
            - **自适应合并阈值**：写盘触发门槛提升至 50,000 条，杜绝无意义的 275MB 频繁落盘。
            - **574 项单元测试全数通过**：完全兼容原有极速搜索与 AST 过滤语法。

            #### 安装说明：
            1. 下载 `MacEverything-Green.dmg` 并拖入「应用程序」文件夹。
            2. 首次启动若提示“无法打开，因为无法验证开发者”，请在 **系统设置 -> 隐私与安全性** 中点击 **“仍要打开”**。
            3. 授予 **完全磁盘访问权限**（Full Disk Access）以建立全局极速索引。
          draft: false
          prerelease: false
